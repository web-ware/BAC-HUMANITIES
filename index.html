;animation-duration:.01ms!important;transition-duration:.01ms!important}}

const subjects=[

const lessons=[
{id:1,title:'Perception — الإدراك',subject:'philosophy',category:'Perception',description:'How sensation, attention and thought participate in our experience of reality.',tags:['Perception','Knowledge'],minutes:45,content:[['01 — Introduction','Perception is not simply the passive reception of sensations. It is an organized activity through which the mind gives meaning to what is encountered. The same object may be experienced differently according to attention, memory, expectations and context.'],['02 — Sensation and perception','Sensation refers to the reception of stimuli, while perception concerns the organization and interpretation of those stimuli. In ordinary experience the two are closely connected, but distinguishing them helps us understand why seeing is more than receiving light.'],['03 — The philosophical problem','A central question is whether perception gives us reality itself or only a mediated appearance. Rationalist approaches emphasize the role of thought and judgment; empiricist approaches give a stronger place to experience and the senses.'],['04 — Positions','Plato associates knowledge with a movement beyond unstable appearances. Descartes treats sensory experience as potentially deceptive and searches for certainty through thought. Berkeley emphasizes that what we call objects is inseparable from perception, while Alain stresses the active role of attention and interpretation.'],['05 — Discussion','Neither pure sensation nor pure intellect alone explains the richness of perception. Contemporary approaches commonly study perception as an interaction between incoming information, prior knowledge, attention and action.'],['06 — Summary','Perception is an active organization of experience. The philosophical difficulty lies in determining the relation between what appears to us and what reality is.']]},
{id:2,title:'Consciousness — الوعي',subject:'philosophy',category:'Consciousness',description:'The self, awareness and the question of what it means to be conscious.',tags:['Consciousness','Self'],minutes:40,content:[['01 — Introduction','Consciousness names our awareness of ourselves, our experiences and, in many cases, the world around us. It raises questions about identity, freedom and the relation between mind and body.'],['02 — Self-awareness','To be conscious is not merely to receive information. Human consciousness can turn back upon itself: we can notice our own thoughts, examine our motives and deliberately revise our judgments.'],['03 — Philosophical approaches','Descartes places thinking at the center of certainty about the self. Phenomenological traditions examine lived experience from the first-person perspective, while materialist approaches investigate the relation between consciousness and physical processes.'],['04 — Summary','Consciousness can be studied as awareness, self-relation and lived experience. The concept remains one of philosophy’s major meeting points with psychology and neuroscience.']]},
{id:3,title:'Language and Thought — اللغة والفكر',subject:'philosophy',category:'Language',description:'Does language express thought, shape it, or both?',tags:['Language','Thought'],minutes:35,content:[['01 — The problem','Thought often appears inseparable from words, symbols and concepts. Yet we can sometimes imagine, perceive or act without forming a complete verbal sentence.'],['02 — Language as expression','One classical position sees language as a tool for communicating ideas already present in the mind. This view highlights communication but may underestimate how vocabulary and concepts influence reflection.'],['03 — Language as formation','Other approaches emphasize that learning a language gives us categories through which distinctions become easier to formulate. Language therefore participates in organizing experience rather than merely reporting it.'],['04 — Summary','The relation is best approached as reciprocal: thought gives language content, while language supplies structures through which thought can become precise and communicable.']]},
{id:4,title:'Freedom and Determinism — الحرية والحتمية',subject:'philosophy',category:'Freedom',description:'Can a human being be free if actions have causes?',tags:['Freedom','Ethics'],minutes:38,content:[['01 — The question','Freedom is commonly understood as the capacity to choose and act. Determinism, in its strongest form, claims that events follow necessary causal conditions.'],['02 — The tension','If every action has sufficient causes, it can seem that no one genuinely chooses. But an action can also be considered free when it expresses the person’s reasons and values rather than external coercion.'],['03 — Synthesis','The philosophical debate distinguishes freedom from simple absence of causes. It asks what kind of causal relation can coexist with responsibility.']]},
{id:5,title:'The Unconscious — اللاوعي',subject:'philosophy',category:'Unconscious',description:'Hidden processes, desire and the limits of transparent self-knowledge.',tags:['Unconscious','Self'],minutes:42,content:[['01 — Introduction','The idea of unconscious mental activity challenges the belief that the subject fully knows the causes of its own behavior.'],['02 — Freud and interpretation','Freud develops the unconscious as a dynamic domain connected with desire, conflict and repression. His model became influential far beyond clinical practice, although many of its claims remain debated.'],['03 — Philosophical significance','The unconscious raises a broader problem: if part of mental life escapes immediate awareness, how should we understand responsibility, identity and self-knowledge?']]},
{id:6,title:'Truth — الحقيقة',subject:'philosophy',category:'Truth',description:'Correspondence, coherence and the search for justified knowledge.',tags:['Truth','Knowledge'],minutes:37,content:[['01 — What is truth?','Truth concerns the relation between statements and what they claim about reality. Philosophers have proposed several models for explaining that relation.'],['02 — Main approaches','Correspondence connects truth with reality; coherence emphasizes consistency within a system of propositions; pragmatic approaches examine what succeeds through inquiry and practice.'],['03 — Summary','The concept of truth cannot be reduced to sincerity. A belief may be sincerely held and still be false, which is why justification and critical examination matter.']]},
{id:7,title:'World War II — الحرب العالمية الثانية',subject:'history',category:'World War II',description:'Origins, turning points and consequences of the global conflict, 1939–1945.',tags:['World War II','International Relations'],minutes:32,content:[['Context','The war emerged from a combination of unresolved tensions after World War I, aggressive expansion by Axis powers, ideological conflict and failures of collective security.'],['Major phases','The conflict began in Europe in September 1939 and expanded into a global war. Major turning points included the Battle of Britain, the German invasion of the Soviet Union, Pearl Harbor, Stalingrad and Allied landings in Western Europe.'],['Consequences','The war transformed the international balance of power, contributed to the creation of the United Nations, accelerated decolonization and left Europe politically and economically transformed.']]},
{id:8,title:'The Cold War — الحرب الباردة',subject:'history',category:'Cold War',description:'A structured overview of the rivalry between the United States and Soviet Union.',tags:['Cold War','Yalta','International Relations'],minutes:40,content:[['Origins','After 1945, cooperation between the wartime allies weakened as disagreements over security, ideology and the political future of Europe intensified.'],['Bipolar world','The international system became dominated by two superpowers and competing alliances. Rivalry took political, military, economic and technological forms without becoming a direct full-scale war between the two centers.'],['Major crises','The Berlin crises, Korean War, Cuban Missile Crisis, Vietnam and the Soviet war in Afghanistan illustrate how the rivalry affected different regions.'],['End','Reforms under Mikhail Gorbachev, economic difficulties, political change in Eastern Europe and the dissolution of the Soviet Union in 1991 marked the end of the Cold War order.']]},
{id:9,title:'Yalta Conference — مؤتمر يالطا',subject:'history',category:'Cold War',description:'The February 1945 meeting of Roosevelt, Churchill and Stalin and its place in the postwar order.',tags:['Yalta','World War II','International Relations'],minutes:25,content:[['Date and context','The conference took place in February 1945, when Germany’s defeat was becoming imminent. The leaders of the United States, United Kingdom and Soviet Union discussed the organization of postwar Europe and the final stages of the war.'],['Main issues','Discussions included occupation arrangements in Germany, the future of Poland, the establishment of a new international organization and Soviet participation against Japan.'],['Historical importance','Yalta became an important reference point in later debates about the division of Europe and the origins of the Cold War, although historians disagree over how much of the later division was decided there.']]},
{id:10,title:'Decolonization — تصفية الاستعمار',subject:'history',category:'Decolonization',description:'The political transformation that ended many formal colonial empires after 1945.',tags:['Decolonization','International Relations'],minutes:28,content:[['Background','World War II weakened European colonial powers while anti-colonial movements gained strength. The language of self-determination also became more prominent in international politics.'],['Forms','Independence could emerge through negotiation, mass political mobilization, armed conflict or combinations of these. India, Algeria, Ghana and Indonesia illustrate different trajectories.'],['Consequences','Decolonization changed the map of states and reshaped international institutions, but political independence did not automatically eliminate economic dependency.']]},
{id:11,title:'Population and Development — السكان والتنمية',subject:'geography',category:'Population',description:'Population dynamics, indicators and the relationship between demographic change and development.',tags:['Population','Development'],minutes:26,content:[['Population dynamics','Birth rates, death rates, migration and age structure influence the size and composition of populations.'],['Development','Development is multidimensional: income matters, but so do health, education, infrastructure, employment and quality of life.'],['Key idea','Demographic change does not mechanically determine development. Policies, institutions, resources and global economic relations all shape outcomes.']]},
{id:12,title:'Globalization — العولمة',subject:'geography',category:'Globalization',description:'Flows of goods, capital, information and people across an increasingly connected world.',tags:['Globalization','Economy'],minutes:30,content:[['Definition','Globalization refers to the intensification of connections between territories through economic, technological, cultural and political flows.'],['Actors','States remain important, alongside multinational firms, international organizations, cities and civil society networks.'],['Contradictions','Globalization can expand markets and communication while also producing unequal benefits, territorial competition and vulnerabilities to global shocks.']]},
{id:13,title:'Arabic Rhetoric — البلاغة وتحليل النص',subject:'arabic',category:'Literature',description:'A practical framework for identifying rhetorical structures and explaining their effects.',tags:['Arabic','Analysis'],minutes:24,content:[['Introduction','Text analysis begins by identifying the communicative situation, central idea and organization before moving to stylistic details.'],['Rhetorical devices','Metaphor, simile, antithesis, repetition and other devices should not merely be named: the strong answer explains their function and effect in context.'],['Method','Quote a short passage, identify the device, explain its meaning and connect it to the author’s purpose.']]}
];
const articles=[
{id:1,title:'هل الإدراك مجرد عملية حسية؟',subject:'philosophy',category:'Perception',description:'مقال فلسفي مقارن حول دور الحواس والعقل في بناء الإدراك.',tags:['Perception','Knowledge'],sections:[['The Problem','إذا كانت الحواس تمدنا بالمعطيات الأولى، فهل يكفي ذلك لتفسير الإدراك؟ أم أن العقل يتدخل في تنظيم هذه المعطيات وتأويلها؟'],['Position I — The senses','تبدو الحواس نقطة الانطلاق الطبيعية: فالرؤية والسمع واللمس تجعل الإنسان على اتصال بالعالم. غير أن المعطى الحسي وحده لا يفسر لماذا ندرك الشيء بوصفه شيئا منظما ذا معنى.'],['Position II — The intellect','يمكن للعقل أن يربط بين المعطيات، ويميز الثابت من المتغير، ويستخدم الذاكرة والتوقع والانتباه. لذلك لا يظهر الإدراك كاستقبال آلي بل كنشاط مركب.'],['Discussion','التعارض الحاد بين الحواس والعقل يفوّت طبيعة العملية الإدراكية. الحواس توفر المادة، بينما يساهم النشاط الذهني في تنظيمها وفهمها.'],['Synthesis','الإدراك علاقة بين الذات والعالم، وليس نسخة فوتوغرافية عن الواقع ولا اختراعا ذهنيا منفصلا عنه.'],['Conclusion','يمكن القول إن الإدراك يتأسس على الحس لكنه يتجاوز الإحساس بفضل التنظيم والتأويل والانتباه.']]},
{id:2,title:'هل الوعي شفاف لصاحبه؟',subject:'philosophy',category:'Consciousness',description:'مقال يبحث في حدود معرفة الإنسان بذاته.',tags:['Consciousness','Unconscious'],sections:[['Introduction','يبدو أن الإنسان أقدر الناس على معرفة ما يجري في داخله، فهو يعيش أفكاره ورغباته مباشرة. لكن هل تعني المعايشة أن كل ما في الذات مكشوف للوعي؟'],['Position I','يمكن الدفاع عن أولوية الوعي انطلاقا من الخبرة الداخلية: التفكير والتأمل يمنحان الذات قدرة على فحص أفكارها ونواياها.'],['Position II','تكشف فكرة اللاوعي أن الإنسان قد لا يملك وصولا كاملا إلى دوافعه. كما تؤثر العادات والانفعالات والذاكرة في السلوك دون أن تكون حاضرة دائما في الانتباه.'],['Synthesis','الوعي قدرة حقيقية على المراجعة، لكنه ليس نافذة شفافة بالكامل. قوته تظهر أيضا في قدرته على اكتشاف حدوده.']]},
{id:3,title:'هل اللغة أداة للتعبير أم شرط للتفكير؟',subject:'philosophy',category:'Language',description:'مقارنة بين تصور اللغة كوسيلة اتصال وتصورها كبنية تؤثر في الفكر.',tags:['Language','Thought'],sections:[['Introduction','حين نقول إننا نعبر عن فكرة بالكلمات، نفترض أن الفكرة موجودة أولا ثم تأتي اللغة لتلبسها. لكن الكلمات نفسها قد تمنحنا مفاهيم وتمييزات لم تكن واضحة قبل التعبير.'],['Position I','اللغة وسيلة للتواصل ونقل المعاني بين الذوات، وهذا يفسر قدرتها على حفظ المعرفة وتداولها.'],['Position II','لكن اللغة لا تنقل المعنى فقط؛ فهي تتيح تسمية الفروق وترتيبها وصياغة الحجج. ومن هنا يمكن أن تؤثر في طريقة تنظيم الفكر.'],['Discussion','الأقرب إلى الدقة أن العلاقة تبادلية: الفكر يحتاج إلى اللغة ليصبح قابلا للصياغة الدقيقة، واللغة تتطور لأنها تستجيب لحاجات الفكر والتجربة.'],['Conclusion','لا يصح اختزال اللغة في أداة خارجية محايدة، ولا اعتبار الفكر مستحيلا دون الكلمات في كل حال. العلاقة أكثر تعقيدا وإنتاجية.']]},
{id:4,title:'هل الإنسان حر أم خاضع للحتمية؟',subject:'philosophy',category:'Freedom',description:'مقال تحليلي حول الاختيار والضرورة والمسؤولية.',tags:['Freedom','Ethics'],sections:[['Problem','إذا كانت لكل أفعالنا أسباب، فهل نستطيع مع ذلك اعتبار أنفسنا أحرارا؟'],['Position I','الحرية تظهر في القدرة على الاختيار والمبادرة وتحمل المسؤولية، ولذلك لا يمكن اختزال الفعل الإنساني إلى حركة ميكانيكية.'],['Position II','لكن الوراثة والتربية والظروف الاجتماعية والنفسية تؤثر في الاختيارات. تجاهل هذه الشروط يعطي صورة مبسطة عن الإنسان.'],['Synthesis','قد تكون الحرية قدرة واقعية على الفعل وفق أسباب نفهمها ونتبناها، لا غيابا مطلقا لكل سبب.']]},
{id:5,title:'هل الحقيقة مطلقة أم نسبية؟',subject:'philosophy',category:'Truth',description:'مقال حول شروط الحقيقة وحدود المواقف النسبية والمطلقة.',tags:['Truth','Knowledge'],sections:[['Problem','اختلاف الناس والمجتمعات في الآراء لا يعني بالضرورة أن الحقيقة نفسها تتغير. السؤال هو كيف نميز بين تعدد وجهات النظر وصحة الأحكام.'],['Absolute truth','الموقف الموضوعي يبحث عن معايير تتجاوز الرغبة الفردية، مثل الدليل والاتساق وإمكان التحقق.'],['Relativism','النسبية تذكرنا بأن المعرفة تتأثر باللغة والثقافة والمنظور، لكنها تواجه صعوبة حين تجعل كل حكم مساويا لغيره.'],['Conclusion','يمكن الاعتراف بتعدد زوايا النظر مع الإبقاء على مطلب نقدي للحقيقة والتبرير.']]},
{id:6,title:'الأخلاق: هل الخير مرتبط بالنية أم بالنتيجة؟',subject:'philosophy',category:'Morality',description:'مدخل إلى التوتر بين أخلاق الواجب وأخلاق النتائج.',tags:['Morality','Ethics'],sections:[['The dilemma','قد نؤدي فعلا بنية حسنة لكنه ينتج ضررا. وقد يؤدي شخص فعلا مفيدا بدافع أناني. فبماذا نقيس القيمة الأخلاقية؟'],['Duty','التصور الواجباتي يعطي أهمية للمبدأ الذي يحكم الفعل، ولقدرة الإنسان على احترام قاعدة أخلاقية لا تعتمد فقط على المنفعة.'],['Consequences','التصورات النفعية تنظر إلى آثار الفعل وتحاول تعظيم الخير وتقليل الضرر.'],['Synthesis','النية والنتيجة تقدمان بعدين مختلفين للحكم الأخلاقي، وقد يحتاج التقييم العملي إلى النظر فيهما معا.']]}
];

{id:3,title:'Fall of the Berlin Wall',arabic:'سقوط جدار برلين',date:'9 November 1989',place:'Berlin, Germany',parties:['East Germany','West Germany','European powers'],context:'حدث رمزي مهم في التحولات السياسية التي سبقت نهاية الحرب الباردة.',events:['تزايد الاحتجاجات والهجرة.','إعلان سياسي أدى إلى فتح المعابر.','عبور السكان وسقوط الحواجز الرمزية.'],results:['تسارع توحيد ألمانيا.','تراجع الانقسام السياسي في أوروبا.','اقترب تفكك النظام الثنائي القطبية.'],importance:'رمز لانهيار الانقسام الأوروبي الذي تشكل بعد الحرب العالمية الثانية.',people:['Mikhail Gorbachev'],tags:['Cold War','Europe']}
];

];

/* STATE + STORAGE */
const store={get(k,f){try{return JSON.parse(localStorage.getItem('bac_'+k))??f}catch{return f}},set(k,v){localStorage.setItem('bac_'+k,JSON.stringify(v))}};
let state={theme:store.get('theme','light'),favorites:store.get('favorites',[]),notes:store.get('notes',initialNotes),last:store.get('last',null),font:store.get('font',17),width:store.get('width',930),filters:{subject:'all',type:'all',topic:'all',tag:'all'}};
document.documentElement.dataset.theme=state.theme==='dark'?'dark':'light';
const allTypes=[['lesson',lessons],['article',articles],['summary',summaries],['concept',concepts],['person',historicalFigures],['event',historicalEvents],['link',links]];
const subjectById=id=>subjects.find(x=>x.id===id);
const typeLabel=t=>({lesson:'Lesson',article:'Article',summary:'Summary',concept:'Concept',person:'Person',event:'Event',link:'Link',note:'Note'}[t]||t);
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function slugTitle(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function getBy(type,id){const a=allTypes.find(x=>x[0]===type);return a?.[1].find(x=>String(x.id)===String(id))}
function isFav(type,id){return state.favorites.some(x=>x.type===type&&String(x.id)===String(id))}
function toggleFav(type,id){const i=state.favorites.findIndex(x=>x.type===type&&String(x.id)===String(id));if(i>=0)state.favorites.splice(i,1);else state.favorites.push({type,id});store.set('favorites',state.favorites);toast(i>=0?'Removed from favorites':'Added to favorites');renderCurrent()}
function subjectName(id){return subjectById(id)?.name||''}
function counts(subjectId){return{lessons:lessons.filter(x=>x.subject===subjectId).length,articles:articles.filter(x=>x.subject===subjectId).length,summaries:summaries.filter(x=>x.subject===subjectId).length,concepts:concepts.filter(x=>x.subject===subjectId).length}}
function allContent(){return [...lessons.map(x=>({...x,type:'lesson'})),...articles.map(x=>({...x,type:'article'})),...summaries.map(x=>({...x,type:'summary'})),...concepts.map(x=>({...x,type:'concept'})),...philosophers.map(x=>({...x,type:'person',subject:'philosophy'})),...historicalFigures.map(x=>({...x,type:'person',subject:'history'})),...historicalEvents.map(x=>({...x,type:'event',subject:'history'})),...links.map(x=>({...x,type:'link'})),...state.notes.map(x=>({...x,type:'note',subject:'personal',tags:['Notes']}))]}

/* ROUTER */
let route={name:'home',id:null,sub:null};
function parseRoute(){const h=location.hash.replace(/^#/,'')||'home';const p=h.split('/');route={name:p[0]||'home',id:p[1]||null,sub:p[2]||null}}
function go(name,id='',sub=''){location.hash=[name,id,sub].filter(Boolean).join('/')}
window.addEventListener('hashchange',()=>{parseRoute();renderCurrent();closeMenu();window.scrollTo({top:0,behavior:'smooth'})});

/* COMPONENTS */
function favButton(type,id){return `<button class="fav ${isFav(type,id)?'on':''}" onclick="event.stopPropagation();toggleFav('${type}','${id}')" aria-label="Favorite">${isFav(type,id)?'★':'☆'}</button>`}
function subjectCard(s){const c=counts(s.id);return `<article class="card reveal" onclick="go('subject','${s.id}')" tabindex="0" role="button"><div class="card-top"><div class="card-icon">${s.icon}</div></div><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><div class="meta"><span class="pill">${c.lessons} lessons</span><span class="pill">${c.articles} articles</span><span class="pill">${c.summaries} summaries</span></div></article>`}
function contentCard(x,type){let icon={lesson:'📖',article:'✎',summary:'◈',concept:'◇',person:'♙',event:'◷',link:'↗'}[type]||'•';let desc=x.description||x.definition||x.bio||x.context||'';return `<article class="card content-card reveal" onclick="go('${type}','${x.id}')"><div class="mini">${icon}</div><div class="copy"><div class="card-top"><div><span class="pill">${typeLabel(type)}</span> ${x.subject?`<span class="pill">${esc(subjectName(x.subject))}</span>`:''}</div>${type!=='link'?favButton(type,x.id):''}</div><h3>${esc(x.title||x.name)}</h3><p>${esc(desc).slice(0,155)}${desc.length>155?'…':''}</p><div class="meta">${(x.tags||[]).slice(0,3).map(t=>`<span class="tag" onclick="event.stopPropagation();filterTag('${esc(t)}')">#${esc(t)}</span>`).join('')}</div></div></article>`}
function breadcrumbs(items){return `<div class="breadcrumbs">${items.map((x,i)=>i===items.length-1?`<strong>${esc(x[0])}</strong>`:`<button onclick="go('${x[1]}','${x[2]||''}')">${esc(x[0])}</button><span>›</span>`).join('')}</div>`}
function statCard(n,l){return `<div class="stat"><strong>${n}</strong><span>${l}</span></div>`}
function subjectTabs(s,active){const tabs=[['Overview','overview'],['Lessons','lessons'],['Articles','articles'],['Summaries','summaries'],['Concepts','concepts'],['Philosophers','philosophers'],['Quotes','quotes'],['Notes','notes'],['Links','links']];return `<div class="tabs">${tabs.map(t=>`<button class="${active===t[1]?'active':''}" onclick="go('subject','${s.id}','${t[1]}')">${t[0]}</button>`).join('')}</div>`}

/* PAGES */
function renderHome(){const total=lessons.length+articles.length+summaries.length+concepts.length+philosophers.length+historicalFigures.length+historicalEvents.length+links.length;const recent=[...lessons.slice(-2),...articles.slice(-2),...summaries.slice(-1)];const last=state.last?getBy(state.last.type,state.last.id):null;return `<div class="page"><section class="hero"><div class="hero-main"><div class="eyebrow">Personal knowledge system · BAC 2026</div><h1>BAC<br>Humanities.</h1><p>My Digital Study Notebook — a calm place to study philosophy, history, geography and the humanities, one idea at a time.</p><div class="hero-actions"><button class="btn primary" onclick="go('subjects')">Explore subjects →</button><button class="btn" onclick="go('lessons')">Open lessons</button></div></div><div class="hero-side"><div><div class="quote-mark">“</div><div class="quote">The notebook becomes useful when knowledge starts becoming yours.</div></div><div><div class="eyebrow" style="color:var(--muted)">YOUR LIBRARY</div><p style="font-size:12px;color:var(--muted)">${total} curated records ready to explore.</p></div></div></section><div class="stats">${statCard(subjects.length,'Subjects')}${statCard(lessons.length,'Lessons')}${statCard(articles.length,'Articles')}${statCard(summaries.length,'Summaries')}${statCard(concepts.length,'Concepts')}${statCard(state.notes.length,'Notes')}${statCard(state.favorites.length,'Favorites')}</div>${last?`<section><div class="section-head"><div><h2>Continue studying</h2><p>Pick up where you left off.</p></div></div><div class="card content-card" onclick="go('${state.last.type}','${state.last.id}')"><div class="mini">↻</div><div class="copy"><span class="pill">${typeLabel(state.last.type)}</span><h3>${esc(last.title||last.name)}</h3><p>${esc(last.description||last.definition||last.bio||'')}</p></div></div></section>`:''}<section><div class="section-head"><div><h2>Quick access</h2><p>Your main study rooms.</p></div><button class="btn" onclick="go('subjects')">View all</button></div><div class="grid">${subjects.slice(0,4).map(subjectCard).join('')}</div></section><section><div class="section-head"><div><h2>Recent content</h2><p>Fresh material from the starting library.</p></div></div><div class="list-grid">${recent.map(x=>contentCard(x,x===lessons.find(y=>y.id===x.id)?'lesson':x===articles.find(y=>y.id===x.id)?'article':'summary')).join('')}</div></section></div>`}
function renderSubjects(){return `<div class="page">${breadcrumbs([['Home','home'],['Subjects','subjects']])}<div class="section-head"><div><h2>Subjects</h2><p>Each subject is its own study space.</p></div></div><div class="grid">${subjects.map(subjectCard).join('')}</div></div>`}
function renderSubjectPage(){const s=subjectById(route.id);if(!s)return renderNotFound();const active=route.sub||'overview';const c=counts(s.id);let body='';if(active==='overview'){const items=[...lessons.filter(x=>x.subject===s.id).slice(0,3),...articles.filter(x=>x.subject===s.id).slice(0,3)];body=`<div class="section-head"><div><h2>Featured content</h2><p>A starting path through ${esc(s.name)}.</p></div></div><div class="list-grid">${items.map(x=>contentCard(x,lessons.includes(x)?'lesson':'article')).join('')}</div>`}else if(active==='lessons')body=sectionContent(lessons.filter(x=>x.subject===s.id),'lesson','No lessons yet.');else if(active==='articles')body=sectionContent(articles.filter(x=>x.subject===s.id),'article','No articles yet.');else if(active==='summaries')body=sectionContent(summaries.filter(x=>x.subject===s.id),'summary','No summaries yet.');else if(active==='concepts')body=sectionContent(concepts.filter(x=>x.subject===s.id),'concept','No concepts yet.');else if(active==='philosophers')body=sectionContent(philosophers.filter(x=>x.tags?.some(t=>lessons.some(l=>l.subject===s.id&&l.tags?.includes(t)))),'person','No philosophers connected yet.');else if(active==='quotes')body=renderQuotes(s.id);else if(active==='notes')body=renderNoteSection(s.id);else if(active==='links')body=sectionContent(links.filter(x=>x.subject===s.id),'link','No links yet.');return `<div class="page">${breadcrumbs([['Home','home'],['Subjects','subjects'],[s.name,'subject',s.id]])}<section class="subject-hero"><div class="subject-title"><div class="subject-icon">${s.icon}</div><div><div class="eyebrow">Study room</div><h1>${esc(s.name)}</h1><p>${esc(s.description)}</p></div></div><div class="meta"><span class="pill">${c.lessons} lessons</span><span class="pill">${c.articles} articles</span><span class="pill">${c.summaries} summaries</span><span class="pill">${c.concepts} concepts</span></div></section>${subjectTabs(s,active)}${body}</div>`}
function sectionContent(items,type,empty){if(!items.length)return emptyState('📚',empty,'Your next piece of knowledge belongs here.');return `<div class="grid">${items.map(x=>contentCard(x,type)).join('')}</div>`}
function renderQuotes(subject){let rows=[];philosophers.filter(p=>p.tags?.some(t=>lessons.some(l=>l.subject===subject&&l.tags?.includes(t)))).forEach(p=>(p.quotes||[]).forEach(q=>rows.push({p,q})));return rows.length?`<div class="grid">${rows.map(x=>`<article class="card"><div class="quote-box">“${esc(x.q)}”</div><b>${esc(x.p.name)}</b><p>${esc(x.p.field)}</p></article>`).join('')}</div>`:emptyState('“','No quotes yet.','Add philosopher quotes to grow this collection.')}
function renderNoteSection(subject){const ns=state.notes.filter(n=>subject==='philosophy'&&/فلسف|إدراك|فكر|وعي/.test(n.title+n.text)||subject==='history'&&/يالطا|حرب|تاريخ/.test(n.title+n.text));return ns.length?`<div class="grid note-grid">${ns.map(noteCard).join('')}</div>`:emptyState('📌','No subject notes yet.','Create a note from the + button.')}
function renderAll(type,items,title,desc){return `<div class="page">${breadcrumbs([['Home','home'],[title,route.name]])}<div class="section-head"><div><h2>${title}</h2><p>${desc}</p></div></div><div class="toolbar"><select id="filterSubject" onchange="applyFilters()"><option value="all">All subjects</option>${subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><input id="filterTopic" placeholder="Filter topic…" oninput="applyFilters()"><select id="filterTagSelect" onchange="applyFilters()"><option value="all">All tags</option>${[...new Set(items.flatMap(x=>x.tags||[]))].sort().map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select></div><div id="filteredGrid" class="grid">${items.map(x=>contentCard(x,type)).join('')}</div></div>`}
function renderNotes(){return `<div class="page">${breadcrumbs([['Home','home'],['Notes','notes']])}<div class="section-head"><div><h2>Notes</h2><p>Your personal layer of thinking.</p></div><button class="btn primary" onclick="openNoteModal()">＋ New note</button></div><div class="grid note-grid">${[...state.notes].sort((a,b)=>Number(b.pinned)-Number(a.pinned)).map(noteCard).join('')}</div></div>`}
function noteCard(n){return `<article class="card note-card ${n.pinned?'pinned':''}"><div class="card-top"><span class="pill">${n.pinned?'📌 Pinned':'Note'}</span><button class="fav ${n.favorite?'on':''}" onclick="toggleNoteFavorite(${n.id})">${n.favorite?'★':'☆'}</button></div><h3>${esc(n.title)}</h3><div class="note-text">${esc(n.text)}</div><div class="note-actions"><button onclick="openNoteModal(${n.id})">Edit</button><button onclick="togglePin(${n.id})">${n.pinned?'Unpin':'Pin'}</button><button onclick="deleteNote(${n.id})">Delete</button></div></article>`}
function renderFavorites(){const f=state.favorites.map(x=>{const v=getBy(x.type,x.id);return v?contentCard(v,x.type):''}).join('');return `<div class="page">${breadcrumbs([['Home','home'],['Favorites','favorites']])}<div class="section-head"><div><h2>Favorites</h2><p>Your saved ideas, lessons and reference pages.</p></div></div>${f?`<div class="grid">${f}</div>`:emptyState('★','Nothing saved yet.','Favorite a lesson, article, concept, person or event to see it here.')}</div>`}
function renderPeople(){const all=[...philosophers.map(x=>({...x,kind:'Philosopher'})),...historicalFigures.map(x=>({...x,kind:'Historical figure',subject:'history'}))];return `<div class="page">${breadcrumbs([['Home','home'],['People','people']])}<div class="section-head"><div><h2>People</h2><p>Thinkers and historical actors connected to your subjects.</p></div></div><div class="grid">${all.map(x=>contentCard(x,'person')).join('')}</div></div>`}
function renderEvents(){return `<div class="page">${breadcrumbs([['Home','home'],['Historical Events','events']])}<div class="section-head"><div><h2>Historical Events</h2><p>Events stored as structured knowledge pages.</p></div></div><div class="grid">${historicalEvents.map(x=>contentCard(x,'event')).join('')}</div></div>`}
function renderLinks(){return `<div class="page">${breadcrumbs([['Home','home'],['Links','links']])}<div class="section-head"><div><h2>Links</h2><p>Your external reference shelf.</p></div></div><div class="grid">${links.map(x=>contentCard(x,'link')).join('')}</div></div>`}
function renderSearchPage(){const q=route.id?decodeURIComponent(route.id):'';const results=search(q);return `<div class="page">${breadcrumbs([['Home','home'],['Search','search',q]])}<div class="section-head"><div><h2>Search</h2><p>${results.length} results for “${esc(q)}”.</p></div></div>${results.length?`<div class="grid">${results.map(x=>contentCard(x,x.type)).join('')}</div>`:emptyState('⌕','No results found.','Try a broader keyword or a different topic.')}</div>`}
function search(q){if(!q)return[];const n=q.toLowerCase();return allContent().filter(x=>[x.title,x.name,x.description,x.definition,x.bio,x.context,x.arabic,...(x.tags||[])].filter(Boolean).join(' ').toLowerCase().includes(n))}
function filterTag(t){go('search',encodeURIComponent(t))}
function renderNotFound(){return `<div class="page">${emptyState('404','Page not found.','The notebook could not find this page.')} </div>`}
function emptyState(icon,title,text){return `<div class="empty"><div class="big">${icon}</div><h3>${title}</h3><p>${text}</p></div>`}

/* DETAIL PAGES */
function saveLast(type,id){state.last={type,id};store.set('last',state.last)}
function renderLesson(){const x=getBy('lesson',route.id);if(!x)return renderNotFound();saveLast('lesson',x.id);return `<div class="page">${breadcrumbs([['Home','home'],['Subjects','subjects'],[subjectName(x.subject),'subject',x.subject],['Lessons','subject',x.subject]])}<article class="reader"><header class="reader-head"><div class="reader-kicker">Philosophy lesson · ${esc(x.category)}</div><h1>${esc(x.title)}</h1><p class="reader-lead">${esc(x.description)}</p><div class="reader-tools">${favButton('lesson',x.id)}<button class="btn" onclick="print()">🖨 Print</button><button class="btn" onclick="copyCurrentTitle('${esc(x.title)}')">Copy title</button><span class="pill">${x.minutes||30} min read</span></div></header><div class="reader-body">${x.content.map((s,i)=>`<section><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p>${i===1?`<div class="callout"><b>Key idea</b><br>Perception and understanding are processes of organization, not merely passive recording.</div>`:''}</section>`).join('')}<div class="callout"><b>Revision prompt</b><br>Explain the central problem in your own words, then compare two positions and state your reasoned conclusion.</div></div><div class="section-head"><div><h2>Related lessons</h2><p>Keep building the same conceptual map.</p></div></div><div class="list-grid">${lessons.filter(y=>y.id!==x.id&&y.subject===x.subject).slice(0,3).map(y=>contentCard(y,'lesson')).join('')}</div></article></div>`}
function renderArticle(){const x=getBy('article',route.id);if(!x)return renderNotFound();saveLast('article',x.id);return `<div class="page">${breadcrumbs([['Home','home'],['Subjects','subjects'],[subjectName(x.subject),'subject',x.subject],['Articles','subject',x.subject]])}<article class="reader"><header class="reader-head"><div class="reader-kicker">Philosophical article · ${esc(x.category)}</div><h1>${esc(x.title)}</h1><p class="reader-lead">${esc(x.description)}</p><div class="reader-tools">${favButton('article',x.id)}<button class="btn" onclick="print()">🖨 Print</button><button class="btn" onclick="copyCurrentTitle('${esc(x.title)}')">Copy title</button></div></header><div class="reader-body article-body">${x.sections.map((s,i)=>`<section class="article-section"><div class="eyebrow">${String(i+1).padStart(2,'0')}</div><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p>${i===1?`<div class="quote-box">“الفكرة الفلسفية لا تقاس باسم صاحبها فقط؛ قوتها تظهر في حجتها وفي قدرتها على مواجهة الاعتراض.”</div>`:''}${i===x.sections.length-2?`<div class="callout"><b>Discussion</b><br>اختبر الموقف: ما الذي يفسره جيدا؟ وما الذي يعجز عن تفسيره؟</div>`:''}</section>`).join('')}</div></article></div>`}
function renderSummary(){const x=getBy('summary',route.id);if(!x)return renderNotFound();saveLast('summary',x.id);return `<div class="page">${breadcrumbs([['Home','home'],['Subjects','subjects'],[subjectName(x.subject),'subject',x.subject],['Summaries','subject',x.subject]])}<div class="summary-layout"><div><div class="subject-hero"><div class="eyebrow">Quick revision</div><h1 style="font-family:Georgia,serif;font-size:40px;margin:8px 0">${esc(x.title)}</h1><p style="color:var(--muted)">${esc(x.topic)} · ${subjectName(x.subject)}</p><div class="reader-tools">${favButton('summary',x.id)}<button class="btn" onclick="print()">🖨 Print</button></div></div><div class="summary-block"><h3>Key Points</h3><div class="key-list">${x.points.map((p,i)=>`<div class="key-item"><b>${i+1}.</b> ${esc(p)}</div>`).join('')}</div></div></div><aside><div class="summary-block"><h3>Definitions</h3>${x.definitions.map(d=>`<div class="key-item"><b>${esc(d[0])}</b><br><span style="color:var(--muted)">${esc(d[1])}</span></div>`).join('')}</div><div class="summary-block" style="margin-top:14px"><h3>Keywords</h3><div class="meta">${x.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div></aside></div></div>`}
function renderConcept(){const x=getBy('concept',route.id);if(!x)return renderNotFound();saveLast('concept',x.id);return `<div class="page">${breadcrumbs([['Home','home'],['Concepts','concepts'],[x.title,'concept',x.id]])}<article class="reader"><header class="reader-head"><div class="reader-kicker">Knowledge concept · ${subjectName(x.subject)}</div><h1>${esc(x.title)}</h1><p class="reader-lead">${esc(x.definition)}</p><div class="reader-tools">${favButton('concept',x.id)}<span class="pill">Concept page</span></div></header><div class="reader-body"><div class="callout"><b>Definition</b><br>${esc(x.definition)}</div><h2>Context</h2><p>${esc(x.context)}</p><h2>Main ideas</h2><ul>${x.ideas.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><h2>Examples</h2>${x.examples.map(e=>`<p>${esc(e)}</p>`).join('')}<h2>Related knowledge</h2><div class="meta">${x.related.map(r=>`<span class="tag">${esc(r)}</span>`).join('')}</div></div></article></div>`}
function renderPerson(){const x=philosophers.find(p=>String(p.id)===String(route.id))||historicalFigures.find(p=>String(p.id)===String(route.id));if(!x)return renderNotFound();const phil=philosophers.includes(x);saveLast('person',x.id);return `<div class="page">${breadcrumbs([['Home','home'],['People','people'],[x.name,'person',x.id]])}<div class="entity-layout"><aside class="entity-profile"><div class="portrait">${phil?'♙':'◉'}</div><h2>${esc(x.name)}</h2><p>${esc(x.arabic||x.role||'')}</p><div class="meta" style="justify-content:center">${(x.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>${favButton('person',x.id)}</aside><article class="reader" style="max-width:none"><header class="reader-head"><div class="reader-kicker">${phil?'Philosopher':'Historical figure'}</div><h1>${esc(x.arabic||x.name)}</h1><p class="reader-lead">${esc(x.bio)}</p></header><div class="reader-body">${phil?`<h2>Era & field</h2><p>${esc(x.era)} · ${esc(x.field)}</p><h2>Main ideas</h2><ul>${x.ideas.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><h2>Important works</h2><div class="meta">${x.works.map(w=>`<span class="pill">${esc(w)}</span>`).join('')}</div><h2>Quotes</h2>${x.quotes.map(q=>`<div class="quote-box">“${esc(q)}”</div>`).join('')}<h2>Related</h2><div class="meta">${x.related.map(r=>`<span class="tag">${esc(r)}</span>`).join('')}</div>`:`<h2>Period & role</h2><p>${esc(x.period)} · ${esc(x.role)}</p><h2>Historical positions</h2><ul>${x.positions.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><h2>Related events</h2><div class="meta">${x.events.map(e=>`<span class="pill">${esc(e)}</span>`).join('')}</div>`}</div></article></div></div>`}
function renderEvent(){const x=getBy('event',route.id);if(!x)return renderNotFound();saveLast('event',x.id);return `<div class="page">${breadcrumbs([['Home','home'],['Historical Events','events'],[x.title,'event',x.id]])}<article class="reader"><header class="reader-head"><div class="reader-kicker">Historical event</div><h1>${esc(x.arabic)}</h1><p class="reader-lead">${esc(x.context)}</p><div class="reader-tools">${favButton('event',x.id)}<span class="pill">${esc(x.date)}</span><span class="pill">${esc(x.place)}</span><button class="btn" onclick="print()">🖨 Print</button></div></header><div class="reader-body"><div class="event-head"><div class="event-date">${esc(x.date)}</div><h3>${esc(x.title)}</h3><p>${esc(x.place)}</p><div class="meta">${x.parties.map(p=>`<span class="pill">${esc(p)}</span>`).join('')}</div></div><h2>Context</h2><p>${esc(x.context)}</p><h2>What happened?</h2><div class="timeline">${x.events.map((e,i)=>`<div class="timeline-item"><b>Stage ${i+1}</b><p>${esc(e)}</p></div>`).join('')}</div><h2>Results</h2><ul>${x.results.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><h2>Historical significance</h2><div class="callout">${esc(x.importance)}</div><h2>Related people</h2><div class="meta">${x.people.map(p=>`<span class="tag">${esc(p)}</span>`).join('')}</div></div></article></div>`}
function renderLink(){const x=getBy('link',route.id);if(!x)return renderNotFound();return `<div class="page">${breadcrumbs([['Home','home'],['Links','links'],[x.title,'link',x.id]])}<div class="reader"><header class="reader-head"><div class="reader-kicker">External reference</div><h1>${esc(x.title)}</h1><p class="reader-lead">${esc(x.description)}</p><div class="reader-tools"><button class="btn primary" onclick="window.open('${esc(x.url)}','_blank','noopener')">Open source ↗</button>${favButton('link',x.id)}</div></header><div class="reader-body"><div class="callout"><b>Use this source for</b><br>Background reading, verification and deeper research. Always evaluate sources critically and record the exact reference you use in your study work.</div><p>${esc(x.url)}</p><div class="meta">${x.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div></div></div>`}

/* NOTES */
function openNoteModal(id=null){const n=id?state.notes.find(x=>x.id===id):null;document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><h2>${n?'Edit note':'New note'}</h2><div class="form"><div><label for="noteTitle">Title</label><input id="noteTitle" value="${esc(n?.title||'')}" placeholder="A clear title"></div><div><label for="noteText">Note</label><textarea id="noteText" placeholder="Write your thought…">${esc(n?.text||'')}</textarea></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveNote(${id||'null'})">Save note</button></div></div></div>`;setTimeout(()=>document.getElementById('noteTitle')?.focus(),50)}
function saveNote(id){const title=document.getElementById('noteTitle').value.trim(),text=document.getElementById('noteText').value.trim();if(!title||!text){toast('Title and note are required');return}if(id){const n=state.notes.find(x=>x.id===id);Object.assign(n,{title,text})}else state.notes.unshift({id:Date.now(),title,text,pinned:false,favorite:false,created:new Date().toISOString().slice(0,10)});store.set('notes',state.notes);closeModal();toast('Note saved');renderCurrent()}
function deleteNote(id){if(confirm('Delete this note?')){state.notes=state.notes.filter(x=>x.id!==id);store.set('notes',state.notes);toast('Note deleted');renderCurrent()}}
function togglePin(id){const n=state.notes.find(x=>x.id===id);n.pinned=!n.pinned;store.set('notes',state.notes);renderCurrent()}
function toggleNoteFavorite(id){const n=state.notes.find(x=>x.id===id);n.favorite=!n.favorite;store.set('notes',state.notes);renderCurrent()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML='',2300)}
function copyCurrentTitle(t){navigator.clipboard?.writeText(t).then(()=>toast('Copied')).catch(()=>toast('Copy unavailable'))}

/* FILTERS */
function applyFilters(){const subject=document.getElementById('filterSubject')?.value||'all',topic=(document.getElementById('filterTopic')?.value||'').toLowerCase(),tag=document.getElementById('filterTagSelect')?.value||'all';const type=route.name;let items=[];const map={lessons:['lesson',lessons],articles:['article',articles],summaries:['summary',summaries],concepts:['concept',concepts]};if(map[type])items=map[type][1];items=items.filter(x=>(subject==='all'||x.subject===subject)&&(!topic||(x.category||x.topic||'').toLowerCase().includes(topic))&&(tag==='all'||(x.tags||[]).includes(tag)));document.getElementById('filteredGrid').innerHTML=items.map(x=>contentCard(x,map[type][0])).join('')||emptyState('⌕','No matches.','Adjust the filters and try again.')}

/* GLOBAL SEARCH */
const globalSearch=document.getElementById('globalSearch'),searchResults=document.getElementById('searchResults');
globalSearch.addEventListener('input',()=>{const q=globalSearch.value.trim();if(!q){searchResults.hidden=true;return}const r=search(q).slice(0,8);searchResults.innerHTML=r.length?r.map(x=>`<button onclick="go('${x.type}','${x.id}');globalSearch.value='';searchResults.hidden=true"><b>${esc(x.title||x.name)}</b><small>${typeLabel(x.type)}${x.subject?' · '+esc(subjectName(x.subject)):''}</small></button>`).join(''):emptyState('⌕','No matches','Try another word.');searchResults.hidden=false});document.addEventListener('click',e=>{if(!document.getElementById('searchBox').contains(e.target))searchResults.hidden=true});

/* THEME + MOBILE */
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme==='dark'?'dark':'light';store.set('theme',state.theme)}
document.getElementById('themeBtn').onclick=toggleTheme;document.getElementById('themeSide').onclick=toggleTheme;document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('addNoteBtn').onclick=()=>openNoteModal();
function closeMenu(){document.getElementById('sidebar').classList.remove('open')}

document.querySelectorAll('.nav button[data-route]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.route)));

/* RENDER */
function renderCurrent(){parseRoute();const v=document.getElementById('appView');let html='';if(route.name==='home')html=renderHome();else if(route.name==='subjects')html=renderSubjects();else if(route.name==='subject')html=renderSubjectPage();else if(route.name==='lessons')html=renderAll('lesson',lessons,'All Lessons','Every lesson in one searchable shelf.');else if(route.name==='articles')html=renderAll('article',articles,'All Articles','Philosophical writing and argument maps.');else if(route.name==='summaries')html=renderAll('summary',summaries,'All Summaries','Fast revision pages for active recall.');else if(route.name==='concepts')html=renderAll('concept',concepts,'All Concepts','Your growing knowledge graph, one concept at a time.');else if(route.name==='people')html=renderPeople();else if(route.name==='events')html=renderEvents();else if(route.name==='notes')html=renderNotes();else if(route.name==='favorites')html=renderFavorites();else if(route.name==='links')html=renderLinks();else if(route.name==='search')html=renderSearchPage();else if(route.name==='lesson')html=renderLesson();else if(route.name==='article')html=renderArticle();else if(route.name==='summary')html=renderSummary();else if(route.name==='concept')html=renderConcept();else if(route.name==='person')html=renderPerson();else if(route.name==='event')html=renderEvent();else if(route.name==='link')html=renderLink();else html=renderNotFound();v.innerHTML=html;document.querySelectorAll('.nav button[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route.name));if(route.name==='lessons'||route.name==='articles'||route.name==='summaries'||route.name==='concepts')setTimeout(()=>syncFilterValues(),0)}
function syncFilterValues(){const s=document.getElementById('filterSubject');if(s)s.value=state.filters.subject}
window.toggleFav=toggleFav;window.go=go;window.openNoteModal=openNoteModal;window.saveNote=saveNote;window.deleteNote=deleteNote;window.togglePin=togglePin;window.toggleNoteFavorite=toggleNoteFavorite;window.closeModal=closeModal;window.applyFilters=applyFilters;window.filterTag=filterTag;window.copyCurrentTitle=copyCurrentTitle;
renderCurrent();
</script>
</body>
</html>
